<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0907" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <title>DeckChat</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="titlebar">
        <h1 class="title">
          <span class="title-orn title-orn-left" aria-hidden="true"></span>
          <span class="title-text">DeckChat</span>
          <span class="title-orn title-orn-right" aria-hidden="true"></span>
        </h1>
        <div id="status-host" class="status-host"></div>
      </header>
      <main id="chat-host" class="chat-frame frame"></main>
      <footer id="compose-host" class="compose-frame"></footer>
    </div>
    <noscript>DeckChat needs JavaScript turned on.</noscript>
  </body>
</html>
